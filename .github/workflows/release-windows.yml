name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        run: pnpm run build && pnpm exec electron-builder --win --x64 --publish never

      - name: Verify dist artifacts
        shell: bash
        run: |
          echo "=== dist ==="
          ls -la dist || true
          shopt -s nullglob
          exes=(dist/*.exe)
          ymls=(dist/*.yml)
          echo "exes: ${#exes[@]} ymls: ${#ymls[@]}"
          if [[ ${#exes[@]} -lt 1 ]]; then
            echo "ERROR: no hay .exe en dist/"
            exit 1
          fi
          if [[ ${#ymls[@]} -lt 1 ]]; then
            echo "ERROR: no hay .yml (latest/beta) en dist/"
            exit 1
          fi

      - name: Detect prerelease
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *beta* || "$TAG" == *alpha* || "$TAG" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Solo patrones que siempre existen tras Verify (blockmap es opcional)
          files: |
            dist/*.exe
            dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
