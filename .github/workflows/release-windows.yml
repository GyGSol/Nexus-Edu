name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        run: pnpm run build && pnpm exec electron-builder --win --x64 --publish never

      - name: Verify dist artifacts
        shell: bash
        run: |
          echo "=== dist ==="
          ls -la dist || true
          shopt -s nullglob
          exes=(dist/*.exe)
          ymls=(dist/*.yml)
          # electron-updater necesita el blockmap del setup NSIS (p. ej. *-setup.exe.blockmap)
          blockmaps=(dist/*.blockmap)
          echo "exes: ${#exes[@]} ymls: ${#ymls[@]} blockmaps: ${#blockmaps[@]}"
          ls -la dist/*.exe dist/*.yml dist/*.blockmap 2>/dev/null || true
          if [[ ${#exes[@]} -lt 1 ]]; then
            echo "ERROR: no hay .exe en dist/"
            exit 1
          fi
          if [[ ${#ymls[@]} -lt 1 ]]; then
            echo "ERROR: no hay .yml (latest/beta) en dist/"
            exit 1
          fi
          if [[ ${#blockmaps[@]} -lt 1 ]]; then
            echo "ERROR: no hay .blockmap en dist/ (auto-update Win falla sin ellos)"
            exit 1
          fi

      - name: Detect prerelease
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *beta* || "$TAG" == *alpha* || "$TAG" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recreate GitHub Release (evita Release vacía rota)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release delete "$TAG" --yes || true
          PRE=""
          LATEST_FLAG=""
          if [[ "$TAG" == *beta* || "$TAG" == *alpha* || "$TAG" == *rc* ]]; then
            PRE="--prerelease"
            LATEST_FLAG="--latest=false"
          else
            LATEST_FLAG="--latest"
          fi
          # exe + yml + blockmap (sin blockmap, Actualizar app en Win falla)
          mapfile -t FILES < <(ls dist/*.exe dist/*.yml dist/*.blockmap 2>/dev/null)
          echo "Subiendo: ${FILES[*]}"
          test "${#FILES[@]}" -ge 3
          gh release create "$TAG" "${FILES[@]}" \
            --title "$TAG" \
            --generate-notes \
            $PRE \
            $LATEST_FLAG
